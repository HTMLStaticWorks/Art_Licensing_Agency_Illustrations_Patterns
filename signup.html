<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licensing | Request Portal Access</title>
  <meta name="description" content="Request access credentials to Licensing's private partner portal and surface design repeats catalog database.">
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0A090B',
              midnight: '#16141A',
              royal: '#D76C5C',
              slate: '#64748B',
              teal: '#4A7C75',
              gold: '#DEAB72',
              silver: '#F1F5F9'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="bg-[#0A090B] text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 font-sans">

  <!-- Header / Navigation Back -->
  <header class="p-6 max-w-6xl mx-auto w-full flex items-center justify-between">
    <a href="index.html" class="flex items-center space-x-3 text-white font-serif text-xl tracking-wider">
      <img src="logo.png" alt="Licensing Logo" class="h-8 w-auto rounded">
      <span>LICENSING</span>
    </a>
    <a href="index.html" class="text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-brand-gold transition flex items-center">
      <i class="fa-solid fa-arrow-left mr-2 rtl:ml-2"></i> Back to Home
    </a>
  </header>

  <!-- Signup Main Content Card -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg bg-[#16141A] border border-slate-800 rounded-2xl shadow-2xl p-8 relative overflow-hidden">
      <!-- Glow background accent -->
      <div class="absolute -top-10 -right-10 w-40 h-40 bg-brand-royal/10 rounded-full blur-3xl"></div>
      
      <div class="relative z-10 space-y-6">
        <div class="text-center space-y-2">
          <h2 class="text-2xl font-bold font-serif text-white tracking-wide">Request Portal Access</h2>
          <p class="text-xs text-slate-400">Fill in the fields below to verify your brand registry credentials.</p>
        </div>

        <form class="validated-form space-y-4" onsubmit="handleSignup(event)">
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Full Name</label>
              <div class="relative">
                <input type="text" required placeholder="John Doe" class="w-full bg-[#121014] border border-slate-800 text-white text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
                <span class="error-message text-[10px] text-red-500 block mt-1"></span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Corporate Email</label>
              <div class="relative">
                <input type="email" required placeholder="name@company.com" class="w-full bg-[#121014] border border-slate-800 text-white text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
                <span class="error-message text-[10px] text-red-500 block mt-1"></span>
              </div>
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Company Domain</label>
              <div class="relative">
                <input type="text" required placeholder="e.g. brandname.com" class="w-full bg-[#121014] border border-slate-800 text-white text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
                <span class="error-message text-[10px] text-red-500 block mt-1"></span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Account Role</label>
              <select required class="w-full bg-[#121014] border border-slate-800 text-slate-300 text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
                <option value="brand">Brand Partner (Licensing)</option>
                <option value="artist">Represented Artist</option>
              </select>
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
              <div class="relative">
                <input type="password" id="signup-password" required placeholder="Min 8 characters" class="w-full bg-[#121014] border border-slate-800 text-white text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
                <span class="error-message text-[10px] text-red-500 block mt-1"></span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Confirm Password</label>
              <div class="relative">
                <input type="password" id="signup-confirm" required placeholder="Repeat password" class="w-full bg-[#121014] border border-slate-800 text-white text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
                <span class="error-message text-[10px] text-red-500 block mt-1"></span>
              </div>
            </div>
          </div>

          <div class="flex items-center space-x-2 text-xs pt-1">
            <input type="checkbox" required class="rounded bg-slate-900 border-slate-700 text-brand-royal focus:ring-0">
            <span class="text-slate-400">I agree to the <a href="#" class="text-brand-gold hover:underline">Terms of Service</a> &amp; <a href="#" class="text-brand-gold hover:underline">Privacy Policy</a></span>
          </div>

          <button type="submit" class="w-full bg-brand-gold hover:bg-white text-[#0A090B] font-bold text-xs uppercase tracking-widest py-3 rounded transition duration-300 mt-2">
            Request Access
          </button>
        </form>

        <div class="text-center text-xs text-slate-400 pt-4 border-t border-slate-800">
          Already registered? <a href="login.html" class="text-brand-gold font-bold hover:underline">Portal Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer copyright -->
  <footer class="p-6 text-center text-xs text-slate-600 dark:text-slate-500 border-t border-slate-900/50">
    <p>&copy; 2026 Licensing Agency. All rights reserved. Vetted partner portal access.</p>
  </footer>

  <script>
    function handleSignup(e) {
      e.preventDefault();
      const pwd = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      if (pwd !== confirm) {
        alert('Passwords do not match.');
        return;
      }
      // Redirect to login page upon registration
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
