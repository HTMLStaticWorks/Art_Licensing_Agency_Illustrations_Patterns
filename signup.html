<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licensing | Request Portal Access</title>
  <script>
    localStorage.setItem('theme', 'dark');
    document.documentElement.classList.add('dark');
  </script>
  <meta name="description" content="Request access credentials to Licensing's private partner portal and surface design repeats catalog database.">
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0A090B',
              midnight: '#16141A',
              royal: '#D76C5C',
              slate: '#64748B',
              teal: '#4A7C75',
              gold: '#DEAB72',
              silver: '#F1F5F9'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
</head>
<body class="bg-slate-50 dark:bg-[#0A090B] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 font-sans">

  <!-- Floating Actions (Theme & RTL Toggles) -->
  <div class="fixed top-6 right-6 z-50 flex items-center space-x-3 rtl:space-x-reverse">
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="w-10 h-10 flex items-center justify-center rounded-full border border-slate-300/30 dark:border-white/10 text-brand-navy dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 bg-white dark:bg-[#16141A] transition shadow-sm" aria-label="Toggle theme">
      <i class="fa-solid fa-sun sun-icon hidden text-brand-gold text-sm"></i>
      <i class="fa-solid fa-moon moon-icon text-brand-navy dark:text-slate-300 text-sm"></i>
    </button>

    <!-- RTL Toggle -->
    <button id="rtl-toggle" class="w-10 h-10 flex items-center justify-center text-xs font-bold rounded-full border border-slate-300/30 dark:border-white/10 text-brand-navy dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 bg-white dark:bg-[#16141A] transition shadow-sm" aria-label="Toggle text direction">
      RTL
    </button>
  </div>

  <!-- Signup Main Content Card -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg bg-white dark:bg-[#16141A] border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-8 relative overflow-hidden">
      <!-- Glow background accent -->
      <div class="absolute -top-10 -right-10 w-40 h-40 bg-brand-royal/10 rounded-full blur-3xl"></div>
      
      <div class="relative z-10 space-y-6">
        <div class="text-center space-y-4">
          <a href="index.html" class="inline-flex items-center space-x-3 rtl:space-x-reverse text-slate-900 dark:text-white font-serif text-xl tracking-wider">
            <img src="logo.png" alt="Licensing Logo" class="h-8 w-auto rounded">
            <span>LICENSING</span>
          </a>
          <div class="space-y-2">
            <h2 class="text-2xl font-bold font-serif text-slate-900 dark:text-white tracking-wide">Request Portal Access</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Fill in the fields below to verify your brand registry credentials.</p>
          </div>
        </div>

        <form class="validated-form space-y-4" onsubmit="handleSignup(event)">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Full Name</label>
            <div class="relative">
              <input type="text" required placeholder="John Doe" class="w-full bg-slate-50 dark:bg-[#121014] border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
              <span class="error-message text-[10px] text-red-500 block mt-1"></span>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Corporate Email</label>
            <div class="relative">
              <input type="email" required placeholder="name@company.com" class="w-full bg-slate-50 dark:bg-[#121014] border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
              <span class="error-message text-[10px] text-red-500 block mt-1"></span>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Company Domain</label>
            <div class="relative">
              <input type="text" required placeholder="e.g. brandname.com" class="w-full bg-slate-50 dark:bg-[#121014] border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
              <span class="error-message text-[10px] text-red-500 block mt-1"></span>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Account Role</label>
            <select required class="w-full bg-slate-50 dark:bg-[#121014] border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 text-sm rounded px-4 py-2.5 focus:outline-none focus:border-brand-gold transition">
              <option value="brand">Brand Partner (Licensing)</option>
              <option value="artist">Represented Artist</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Password</label>
            <div class="relative">
              <input type="password" id="signup-password" required placeholder="Min 8 characters" class="w-full bg-slate-50 dark:bg-[#121014] border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm rounded px-4 py-2.5 pr-10 rtl:pr-4 rtl:pl-10 focus:outline-none focus:border-brand-gold transition">
              <button type="button" onclick="togglePasswordVisibility('signup-password', this)" class="absolute right-3 rtl:right-auto rtl:left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white focus:outline-none">
                <i class="fa-regular fa-eye"></i>
              </button>
              <span class="error-message text-[10px] text-red-500 block mt-1"></span>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Confirm Password</label>
            <div class="relative">
              <input type="password" id="signup-confirm" required placeholder="Repeat password" class="w-full bg-slate-50 dark:bg-[#121014] border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm rounded px-4 py-2.5 pr-10 rtl:pr-4 rtl:pl-10 focus:outline-none focus:border-brand-gold transition">
              <button type="button" onclick="togglePasswordVisibility('signup-confirm', this)" class="absolute right-3 rtl:right-auto rtl:left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white focus:outline-none">
                <i class="fa-regular fa-eye"></i>
              </button>
              <span class="error-message text-[10px] text-red-500 block mt-1"></span>
            </div>
          </div>

          <div class="flex items-center space-x-2 rtl:space-x-reverse text-xs pt-1">
            <input type="checkbox" required class="rounded bg-slate-100 dark:bg-slate-900 border-slate-300 dark:border-slate-700 text-brand-royal focus:ring-0">
            <span class="text-slate-500 dark:text-slate-400">I agree to the <a href="#" class="text-brand-gold hover:underline font-medium font-sans">Terms of Service</a> &amp; <a href="#" class="text-brand-gold hover:underline font-medium font-sans">Privacy Policy</a></span>
          </div>

          <button type="submit" class="w-full bg-brand-gold hover:bg-white text-[#0A090B] font-bold text-xs uppercase tracking-widest py-3 rounded transition duration-300 mt-2">
            Request Access
          </button>
        </form>

        <div class="relative my-4 flex items-center justify-center">
          <span class="absolute inset-x-0 h-px bg-slate-200 dark:bg-slate-800"></span>
          <span class="relative bg-white dark:bg-[#16141A] px-4 text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-widest font-bold">Or continue with</span>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <button type="button" class="flex items-center justify-center py-2.5 border border-slate-200 dark:border-slate-800 rounded bg-slate-50 dark:bg-[#121014] text-slate-700 dark:text-slate-300 hover:bg-brand-gold/5 hover:border-brand-gold hover:text-brand-gold dark:hover:bg-brand-gold/10 dark:hover:border-brand-gold dark:hover:text-brand-gold transition-all duration-300 transform hover:-translate-y-0.5 shadow-sm hover:shadow-md">
            <i class="fa-brands fa-google text-base"></i>
          </button>
          <button type="button" class="flex items-center justify-center py-2.5 border border-slate-200 dark:border-slate-800 rounded bg-slate-50 dark:bg-[#121014] text-slate-700 dark:text-slate-300 hover:bg-brand-gold/5 hover:border-brand-gold hover:text-brand-gold dark:hover:bg-brand-gold/10 dark:hover:border-brand-gold dark:hover:text-brand-gold transition-all duration-300 transform hover:-translate-y-0.5 shadow-sm hover:shadow-md">
            <i class="fa-brands fa-apple text-base"></i>
          </button>
          <button type="button" class="flex items-center justify-center py-2.5 border border-slate-200 dark:border-slate-800 rounded bg-slate-50 dark:bg-[#121014] text-slate-700 dark:text-slate-300 hover:bg-brand-gold/5 hover:border-brand-gold hover:text-brand-gold dark:hover:bg-brand-gold/10 dark:hover:border-brand-gold dark:hover:text-brand-gold transition-all duration-300 transform hover:-translate-y-0.5 shadow-sm hover:shadow-md">
            <i class="fa-brands fa-facebook-f text-base"></i>
          </button>
        </div>

        <div class="text-center text-xs text-slate-500 dark:text-slate-400 pt-4 border-t border-slate-200 dark:border-slate-800">
          Already registered? <a href="login.html" class="text-brand-gold font-bold hover:underline">Portal Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
  <script>
    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function handleSignup(e) {
      e.preventDefault();
      const pwd = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      if (pwd !== confirm) {
        alert('Passwords do not match.');
        return;
      }
      // Redirect to login page upon registration
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
